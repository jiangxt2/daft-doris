name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable release candidate commit to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.12", "3.13.7"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src tests/unit tests/contract
      - run: uv run codespell
      - run: >-
          uv run python scripts/check_workflow_pins.py
          .github/workflows/ci.yml .github/workflows/release.yml
      - run: >-
          uv run python scripts/check_release_workflow.py
          .github/workflows/ci.yml .github/workflows/release.yml

  unit:
    name: Unit and contract (Python ${{ matrix.python-version }})
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.12", "3.13.7"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --group dev
      - run: >-
          uv run pytest -p no:cacheprovider tests/unit tests/contract
          -m "not ray" --cov=daft_doris --cov-branch --cov-report=term-missing
      - run: uv run pytest -p no:cacheprovider tests/contract -m ray -vv

  integration:
    name: Doris integration
    needs: [static, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12.12"
      - run: uv sync --locked --all-extras --group dev
      - run: ./scripts/run_doris_it.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: doris-it-logs
          path: .artifacts/it
          if-no-files-found: ignore

  package:
    name: Package
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12.12"
      - run: uv sync --locked --all-extras --group dev
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - run: uv run python -c "import daft_doris; print(daft_doris.__version__)"
