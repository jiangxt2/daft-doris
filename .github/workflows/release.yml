name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full master-reachable commit SHA to validate without publishing
        required: true
        type: string
      expected_version:
        description: Exact package version expected at the candidate commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.candidate.outputs.mode }}
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      master_sha: ${{ steps.candidate.outputs.master_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: master
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch protected master and tag identities
        run: >-
          git fetch --force origin
          +refs/heads/master:refs/remotes/origin/master
          +refs/tags/*:refs/tags/*
      - name: Resolve immutable candidate
        id: candidate
        env:
          CANDIDATE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_version || '' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'dry-run' || 'tag' }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.event.after || '' }}
          EVENT_CREATED: ${{ github.event_name == 'push' && github.event.created || false }}
          EVENT_DELETED: ${{ github.event_name == 'push' && github.event.deleted || false }}
          EVENT_FORCED: ${{ github.event_name == 'push' && github.event.forced || false }}
        run: >-
          python scripts/validate_release_candidate.py
          --mode "${MODE}"
          --candidate-ref "${CANDIDATE_REF}"
          --expected-version "${EXPECTED_VERSION}"
          --tag "${RELEASE_TAG}"
          --master-ref origin/master
          --event-sha "${EVENT_SHA}"
          --event-created "${EVENT_CREATED}"
          --event-deleted "${EVENT_DELETED}"
          --event-forced "${EVENT_FORCED}"
          --github-output "${GITHUB_OUTPUT}"

  gates:
    name: Candidate CI gates
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}

  build:
    name: Build and verify distributions
    needs: [candidate, gates]
    runs-on: ubuntu-latest
    outputs:
      distributions_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - run: uv run python -m build --outdir release-artifacts/packages
      - run: uv run twine check release-artifacts/packages/*
      - run: >-
          uv run python scripts/verify_release_artifacts.py release-artifacts/packages
          --name daft-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release-artifacts/SHA256SUMS
          --prepare
      - name: Upload immutable distributions
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: release-artifacts/
          if-no-files-found: error

  install-smoke:
    name: Install ${{ matrix.distribution }} ${{ matrix.profile }} (Python ${{ matrix.python-version }})
    needs: [candidate, gates, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            profile: base
            extra: ""
            distribution: wheel
          - python-version: "3.12"
            profile: doris
            extra: "[doris]"
            distribution: wheel
          - python-version: "3.12"
            profile: doris-flight
            extra: "[doris-flight]"
            distribution: wheel
          - python-version: "3.12"
            profile: ray
            extra: "[ray]"
            distribution: wheel
          - python-version: "3.12"
            profile: all
            extra: "[all]"
            distribution: wheel
          - python-version: "3.13"
            profile: base
            extra: ""
            distribution: wheel
          - python-version: "3.13"
            profile: doris
            extra: "[doris]"
            distribution: wheel
          - python-version: "3.13"
            profile: doris-flight
            extra: "[doris-flight]"
            distribution: wheel
          - python-version: "3.13"
            profile: ray
            extra: "[ray]"
            distribution: wheel
          - python-version: "3.13"
            profile: all
            extra: "[all]"
            distribution: wheel
          - python-version: "3.12"
            profile: base
            extra: ""
            distribution: sdist
          - python-version: "3.12"
            profile: doris
            extra: "[doris]"
            distribution: sdist
          - python-version: "3.12"
            profile: doris-flight
            extra: "[doris-flight]"
            distribution: sdist
          - python-version: "3.12"
            profile: ray
            extra: "[ray]"
            distribution: sdist
          - python-version: "3.12"
            profile: all
            extra: "[all]"
            distribution: sdist
          - python-version: "3.13"
            profile: base
            extra: ""
            distribution: sdist
          - python-version: "3.13"
            profile: doris
            extra: "[doris]"
            distribution: sdist
          - python-version: "3.13"
            profile: doris-flight
            extra: "[doris-flight]"
            distribution: sdist
          - python-version: "3.13"
            profile: ray
            extra: "[ray]"
            distribution: sdist
          - python-version: "3.13"
            profile: all
            extra: "[all]"
            distribution: sdist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - run: >-
          python scripts/verify_release_artifacts.py release/packages
          --name daft-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - name: Install built distribution
        env:
          EXTRA: ${{ matrix.extra }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          if [ "$DISTRIBUTION" = "wheel" ]; then
            package="$(find release/packages -maxdepth 1 -type f -name '*.whl')"
          else
            package="$(find release/packages -maxdepth 1 -type f -name '*.tar.gz')"
          fi
          test -n "$package"
          python -m pip install "daft-doris${EXTRA} @ file://${GITHUB_WORKSPACE}/${package}"
      - run: python -c "import daft_doris; print(daft_doris.__version__)"

  testpypi-publish:
    name: Publish formal artifact to TestPyPI
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.candidate.result == 'success' &&
      needs.gates.result == 'success' &&
      needs.build.result == 'success' &&
      needs.install-smoke.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, gates, build, install-smoke]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - run: >-
          python scripts/verify_release_tag.py
          --tag "${{ needs.candidate.outputs.tag }}"
          --expected-sha "${{ needs.candidate.outputs.sha }}"
      - run: >-
          python scripts/verify_release_artifacts.py release/packages
          --name daft-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke:
    name: TestPyPI smoke (${{ matrix.profile }})
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.candidate.result == 'success' &&
      needs.testpypi-publish.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, testpypi-publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            extra: ""
          - profile: doris
            extra: "[doris]"
          - profile: doris-flight
            extra: "[doris-flight]"
          - profile: ray
            extra: "[ray]"
          - profile: all
            extra: "[all]"
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install from TestPyPI with PyPI dependency fallback
        env:
          EXTRA: ${{ matrix.extra }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: >-
          python -m pip install
          --index-url https://test.pypi.org/simple/
          --extra-index-url https://pypi.org/simple/
          "daft-doris${EXTRA}==${VERSION}"
      - run: python -c "import daft_doris; print(daft_doris.__version__)"

  publish:
    name: Publish to PyPI
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.candidate.result == 'success' &&
      needs.gates.result == 'success' &&
      needs.build.result == 'success' &&
      needs.install-smoke.result == 'success' &&
      needs.testpypi-publish.result == 'success' &&
      needs.testpypi-smoke.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, gates, build, install-smoke, testpypi-publish, testpypi-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - run: >-
          python scripts/verify_release_tag.py
          --tag "${{ needs.candidate.outputs.tag }}"
          --expected-sha "${{ needs.candidate.outputs.sha }}"
      - run: >-
          python scripts/verify_release_artifacts.py release/packages
          --name daft-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/

  github-release:
    name: Create GitHub Release
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.candidate.result == 'success' &&
      needs.gates.result == 'success' &&
      needs.build.result == 'success' &&
      needs.install-smoke.result == 'success' &&
      needs.testpypi-publish.result == 'success' &&
      needs.testpypi-smoke.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, gates, build, install-smoke, testpypi-publish, testpypi-smoke, publish]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - run: >-
          python scripts/verify_release_tag.py
          --tag "${{ needs.candidate.outputs.tag }}"
          --expected-sha "${{ needs.candidate.outputs.sha }}"
      - run: >-
          python scripts/verify_release_artifacts.py release/packages
          --name daft-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ needs.candidate.outputs.tag }}"
          release/packages/* release/SHA256SUMS
          --title "daft-doris ${{ needs.candidate.outputs.version }}"
          --notes-file "release-notes/v${{ needs.candidate.outputs.version }}.md"
