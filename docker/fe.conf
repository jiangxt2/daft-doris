http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
arrow_flight_sql_port = 8070
priority_networks = 172.31.128.0/24
default_replication_num = 1
# The identifier fixture exercises the documented Unicode-name mode.
enable_unicode_name_support = true
# The amd64 image in GitHub Actions run 31140533682 used JDK 17.0.2, which can
# fail on a partially exposed cgroup v2 hierarchy (OpenJDK JDK-8287073). Keep an
# explicit heap below the 3 GiB container limit when bypassing that metrics path.
JAVA_OPTS_FOR_JDK_17 = "-Dfile.encoding=UTF-8 -Xmx1024m -Xms1024m -XX:-UseContainerSupport --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED"
