be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060
arrow_flight_sql_port = 8050
priority_networks = 172.31.128.0/24
public_host = 127.0.0.1
arrow_flight_sql_proxy_port = 28050
arrow_flight_result_sink_buffer_size_rows = 2
# The Docker IT backend runs in a 4 GiB cgroup. Doris otherwise reserves 5% of
# that cgroup as its low-water mark, which can reject even a 4 KiB allocation
# while the backend process is still well below its own memory limit.
max_sys_mem_available_low_water_mark_bytes = 33554432
